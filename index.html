<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Repair Prices</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #ffc0cb, #ffe4ef);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .background-hearts span {
            position: absolute;
            display: block;
            color: rgba(255, 255, 255, 0.55);
            font-size: 28px;
            animation: floatUp linear infinite;
            user-select: none;
        }

        .background-hearts span:nth-child(1) {
            left: 8%;
            bottom: -40px;
            animation-duration: 12s;
            font-size: 22px;
        }

        .background-hearts span:nth-child(2) {
            left: 20%;
            bottom: -60px;
            animation-duration: 15s;
            font-size: 32px;
        }

        .background-hearts span:nth-child(3) {
            left: 35%;
            bottom: -50px;
            animation-duration: 13s;
            font-size: 24px;
        }

        .background-hearts span:nth-child(4) {
            left: 50%;
            bottom: -70px;
            animation-duration: 18s;
            font-size: 30px;
        }

        .background-hearts span:nth-child(5) {
            left: 65%;
            bottom: -50px;
            animation-duration: 14s;
            font-size: 26px;
        }

        .background-hearts span:nth-child(6) {
            left: 78%;
            bottom: -80px;
            animation-duration: 17s;
            font-size: 34px;
        }

        .background-hearts span:nth-child(7) {
            left: 90%;
            bottom: -40px;
            animation-duration: 12s;
            font-size: 20px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) scale(1.2);
                opacity: 0;
            }
        }

        .card {
            position: relative;
            z-index: 2;
            width: min(90%, 500px);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(209, 77, 132, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.65);
        }

        .emoji {
            font-size: 56px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: #c2185b;
        }

        .subtitle {
            margin-top: 14px;
            margin-bottom: 28px;
            color: #7a4157;
            font-size: 1rem;
            line-height: 1.6;
        }

        .download-btn {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, #ff4f93, #ff7eb3);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            padding: 16px 28px;
            border-radius: 999px;
            box-shadow: 0 10px 25px rgba(255, 79, 147, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 14px 30px rgba(255, 79, 147, 0.45);
        }

        .download-btn:active {
            transform: translateY(0) scale(0.99);
        }

        .small-text {
            margin-top: 18px;
            font-size: 0.9rem;
            color: #8c5b70;
        }

        .footer-hearts {
            margin-top: 18px;
            font-size: 1.2rem;
            color: #ff5c9a;
            letter-spacing: 6px;
        }
    </style>
</head>
<body>
    <div class="background-hearts">
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
    </div>

    <div class="card">
        <div class="emoji">💖</div>
        <h1>Apple Repair Prices</h1>

        <p class="subtitle">
            Download the latest Apple repair prices in Excel format.<br />
        </p>

        <a class="download-btn" href="/api/download">
            💕 Download latest Excel
        </a>

        <div class="footer-hearts">♥ ♥ ♥</div>
    </div>
</body>
</html>
